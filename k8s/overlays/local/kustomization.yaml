apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: rqbank-web
    newName: rqbank-web
    newTag: local          # CI replaces this with the commit SHA
patches:
  - target: { kind: Service, name: rqbank-web }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080