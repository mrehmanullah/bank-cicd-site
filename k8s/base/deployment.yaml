apiVersion: apps/v1
kind: Deployment
metadata:
  name: rqbank-web
  namespace: rqbank
spec:
  replicas: 2
  selector:
    matchLabels: { app: rqbank-web }
  template:
    metadata:
      labels: { app: rqbank-web }
    spec:
      containers:
        - name: web
          image: rqbank-web
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3 }
          livenessProbe:  { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }