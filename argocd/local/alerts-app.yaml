apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rqbank-alerts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mrehmanullah/bank-cicd-site.git
    targetRevision: main
    path: monitoring/rules
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2