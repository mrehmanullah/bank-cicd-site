apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rqbank-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mrehmanullah/bank-cicd-site.git
    targetRevision: main
    path: k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: rqbank
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]